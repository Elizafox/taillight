name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check taillight doc/conf.py
      - run: mypy
      - run: sphinx-build -W --keep-going -b html doc doc/_build/html
      - run: python -m build
      - run: twine check dist/*
      - run: python -m venv /tmp/taillight-wheel
      - run: /tmp/taillight-wheel/bin/pip install --no-index dist/*.whl
      - run: /tmp/taillight-wheel/bin/python -c "from importlib.resources import files; import taillight; assert files('taillight').joinpath('py.typed').is_file()"
